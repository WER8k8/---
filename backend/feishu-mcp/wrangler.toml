name = "feishu-mcp-server"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
FEISHU_API_BASE_URL = "https://open.feishu.cn/open-apis"
FEISHU_OPS_WEBHOOK_URL = "https://open.feishu.cn/open-apis/bot/v2/hook/REPLACE_ME"

[build]
command = "npm run build"

[env.production]
name = "feishu-mcp-server-prod"
[env.production.vars]
FEISHU_API_BASE_URL = "https://open.feishu.cn/open-apis"
FEISHU_OPS_WEBHOOK_URL = "https://open.feishu.cn/open-apis/bot/v2/hook/REPLACE_ME"

[env.development]
name = "feishu-mcp-server-dev"
[env.development.vars]
FEISHU_API_BASE_URL = "https://open.feishu.cn/open-apis"
FEISHU_OPS_WEBHOOK_URL = "https://open.feishu.cn/open-apis/bot/v2/hook/REPLACE_ME"
