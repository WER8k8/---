[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --no-header
    --color=yes
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: 单元测试（纯函数，不依赖外部服务）
    integration: 集成测试（需要 DB/Redis）
    e2e: 端到端测试（需要全栈启动）
    slow: 慢速测试（>1s，CI 可选跳过）
