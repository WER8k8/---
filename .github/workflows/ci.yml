name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --no-deps -r requirements.lock
      - run: python -m pytest tests/unit -m unit -q

  frontend:
    name: Frontend (vitest + cert + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin
    strategy:
      matrix:
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run cert:gate
      - run: npx vue-tsc --noEmit
