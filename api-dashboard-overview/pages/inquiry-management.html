    <style id="theme-vars">
/* Brand CSS — 租户工作台 Dark Dashboard */
:root {
  --uj-motion-duration: 0.3s;
  --uj-motion-ease: cubic-bezier(0.34, 1.56, 0.64, 1);
  /* Seed */
  --seed-color: #4a9b8c;

  /* Core palette */
  --color-background: #0c0d10;
  --color-foreground: #f0f2f5;
  --color-card: #15161a;
  --color-card-foreground: #e4e6eb;
  --color-popover: #1c1d22;
  --color-popover-foreground: #e4e6eb;
  --color-primary: #4a9b8c;
  --color-primary-foreground: #ffffff;
  --color-muted: #1a1b20;
  --color-muted-foreground: #8b8fa0;
  --color-border: #26272e;
  --color-input: #1a1b20;
  --color-ring: #4a9b8c;

  /* Semantic state colors */
  --color-success: #10b981;
  --color-warning: #f59e0b;
  --color-danger: #ef4444;
  --color-info: #3b82f6;

  /* Radius scale */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;

  /* Semantic radius aliases */
  --brand-radius-sm: 6px;
  --brand-radius-md: 10px;
  --brand-radius-lg: 14px;
  --brand-radius-large: 14px;
  --brand-radius-small: 6px;
  --brand-radius-medium: 10px;
}

/* Semantic alias resolution */
.brand-background { background-color: var(--color-background); }
.brand-foreground { color: var(--color-foreground); }
.brand-card { background-color: var(--color-card); }
.brand-card-foreground { color: var(--color-card-foreground); }
.brand-popover { background-color: var(--color-popover); }
.brand-popover-foreground { color: var(--color-popover-foreground); }
.brand-primary { background-color: var(--color-primary); }
.brand-primary-foreground { color: var(--color-primary-foreground); }
.brand-muted { background-color: var(--color-muted); }
.brand-muted-foreground { color: var(--color-muted-foreground); }
.brand-border { border-color: var(--color-border); }
.brand-input { background-color: var(--color-input); }
.brand-ring { box-shadow: 0 0 0 2px var(--color-ring); }

/* Typography scale */
.brand-h1 { font-size: 1.75rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; color: var(--color-foreground); }
.brand-h2 { font-size: 1.3125rem; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; color: var(--color-foreground); }
.brand-h3 { font-size: 1.0625rem; font-weight: 600; line-height: 1.4; color: var(--color-foreground); }
.brand-h4 { font-size: 0.9375rem; font-weight: 600; line-height: 1.4; color: var(--color-card-foreground); }
.brand-body { font-size: 0.875rem; font-weight: 400; line-height: 1.6; color: var(--color-muted-foreground); }
.brand-body-sm { font-size: 0.8125rem; font-weight: 400; line-height: 1.5; color: var(--color-muted-foreground); }
.brand-caption { font-size: 0.75rem; font-weight: 500; line-height: 1.4; color: var(--color-muted-foreground); }
.brand-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace; font-size: 0.8125rem; }

/* Font stack */
.font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    </style>

<!-- MAIN CONTENT -->
<main class="main-content" data-viewport-mode="app-shell" style="height:100vh;overflow:hidden;">
  <div data-scroll-region="primary" style="min-height:0;overflow-y:auto;padding:24px;">

    <!-- 1. PAGE HEADER -->
    <section style="margin-bottom:16px;animation-delay:0ms;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div style="min-width:0;">
          <p style="font-size:12px;color:var(--color-muted-foreground);margin:0 0 4px 0;">获客 · 询盘管理</p>
          <h1 style="font-size:24px;font-weight:700;color:var(--color-foreground);margin:0 0 4px 0;letter-spacing:-0.02em;">询盘管理</h1>
          <p style="font-size:13px;color:var(--color-muted-foreground);margin:0;">管理所有客户询盘，追踪意向等级，提升转化效率</p>
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
          <button class="btn btn--primary"><i data-lucide="plus" style="width:15px;height:15px;"></i> 新建询盘</button>
        </div>
      </div>
    </section>

    <!-- 2. KPI STATS ROW -->
    <section class="kpi-grid" style="animation-delay:40ms;">
      <div class="panel" style="cursor:default;">
        <div class="yd-stats-card">
          <div class="__label" style="display:flex;align-items:center;gap:6px;"><i data-lucide="message-square-plus" style="width:14px;height:14px;color:var(--color-info);"></i> 今日新询盘</div>
          <div class="__value tone-blue" style="color:var(--color-info);"><span class="count-up" data-target="12" data-duration="900">0</span></div>
          <div class="__hint">较昨日 <span style="color:var(--color-success);">+3</span></div>
        </div>
      </div>
      <div class="panel" style="cursor:default;">
        <div class="yd-stats-card">
          <div class="__label" style="display:flex;align-items:center;gap:6px;"><i data-lucide="clock" style="width:14px;height:14px;color:var(--color-warning);"></i> 待处理</div>
          <div class="__value tone-amber" style="color:var(--color-warning);"><span class="count-up" data-target="7" data-duration="900">0</span></div>
          <div class="__hint">建议优先电话跟进</div>
        </div>
      </div>
      <div class="panel" style="cursor:default;">
        <div class="yd-stats-card">
          <div class="__label" style="display:flex;align-items:center;gap:6px;"><i data-lucide="bar-chart-3" style="width:14px;height:14px;color:var(--color-primary);"></i> 本月累计</div>
          <div class="__value tone-green" style="color:var(--color-primary);"><span class="count-up" data-target="156" data-duration="900">0</span></div>
          <div class="__hint">截至 7 月 21 日</div>
        </div>
      </div>
      <div class="panel" style="cursor:default;">
        <div class="yd-stats-card">
          <div class="__label" style="display:flex;align-items:center;gap:6px;"><i data-lucide="trending-up" style="width:14px;height:14px;color:var(--color-success);"></i> 转化率</div>
          <div class="__value tone-purple" style="color:var(--color-success);">23.5%</div>
          <div class="__hint">本月环比 <span style="color:var(--color-success);">+2.1%</span></div>
        </div>
      </div>
    </section>

    <!-- 3. FILTER BAR -->
    <section class="panel" style="padding:12px 16px;margin-bottom:16px;cursor:default;animation-delay:80ms;">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <!-- Status tabs -->
        <div style="display:flex;align-items:center;gap:2px;background:rgba(255,255,255,0.04);border-radius:8px;padding:3px;">
          <button class="status-tab active" data-status="all" onclick="filterStatus(this)">全部</button>
          <button class="status-tab" data-status="pending" onclick="filterStatus(this)">待处理 <span style="opacity:0.7;">(7)</span></button>
          <button class="status-tab" data-status="quoted" onclick="filterStatus(this)">处理中 <span style="opacity:0.7;">(5)</span></button>
          <button class="status-tab" data-status="accepted" onclick="filterStatus(this)">已完成 <span style="opacity:0.7;">(4)</span></button>
        </div>
        <!-- Source dropdown -->
        <div style="position:relative;">

var statusLabels = { pending:'待处理', quoted:'处理中', accepted:'已完成' };
var intentLabels = { A:'高意向', B:'中等', C:'初步', D:'低意向' };

var expandedId = null;

function renderTable(data) {
  var tbody = document.getElementById('inquiryTableBody');
  if (!tbody) return;
  var html = '';
  for (var i = 0; i < data.length; i++) {
    var inq = data[i];
    var isExpanded = expandedId === inq.id;

    html += '<td style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--color-muted-foreground);">' + inq.company + '</td>';
    html += '<td>';
    html += '<div class="contact-item"><svg style="width:12px;height:12px;flex-shrink:0;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + inq.phone + '</span></div>';
    if (inq.wechat) {
      html += '<div class="contact-item" style="margin-top:2px;"><svg style="width:12px;height:12px;flex-shrink:0;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + inq.wechat + '</span></div>';
    }
    html += '</td>';
    html += '<td style="white-space:nowrap;"><span style="margin-right:4px;">' + inq.countryFlag + '</span>' + inq.country + '</td>';
    html += '<td style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + inq.product + '</td>';
    html += '<td style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--color-muted-foreground);font-size:12px;max-width:140px;">' + inq.messageShort + '</td>';
    html += '<td style="text-align:center;"><span class="intent-badge intent-badge--' + inq.intent + '">' + inq.intent + '</span></td>';
    html += '<td style="text-align:center;"><span class="status-badge status-badge--' + inq.status + '">' + statusLabels[inq.status] + '</span></td>';
    html += '<td style="white-space:nowrap;">' + inq.assignee + '</td>';
    html += '<td style="text-align:right;">';
    html += '<div style="display:flex;align-items:center;justify-content:flex-end;gap:4px;">';
    if (inq.status === 'pending') {
      html += '<button class="btn btn--primary btn--sm" onclick="event.stopPropagation();markProcessing(\'' + inq.id + '\')" style="font-size:11px;padding:3px 8px;">标记处理中</button>';
    }
    if (inq.status !== 'accepted') {
      html += '<button class="btn btn--sm" style="background:rgba(16,185,129,0.12);color:#10b981;border:1px solid rgba(16,185,129,0.2);' + (inq.status === 'pending' ? '' : '') + '" onclick="event.stopPropagation();markComplete(\'' + inq.id + '\')" ' + (inq.status === 'pending' ? 'disabled' : '') + '>完成</button>';
    }
    html += '<button class="btn btn--default btn--sm" onclick="event.stopPropagation();" style="padding:3px 6px;" title="更多操作"><svg style="width:14px;height:14px;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>';

    if (isExpanded) {
      html += '<tr class="expanded-detail"><td colspan="12"><div class="expanded-inner">';

      html += '<div class="expanded-panel">';

      html += '<span class="intent-badge intent-badge--' + inq.intent + '" style="width:auto;padding:4px 12px;font-size:12px;">' + intentLabels[inq.intent] + '</span>';
      html += '</div>';
      html += '<div class="suggestion-box">' + inq.suggestions + '</div>';
      html += '<ul class="reason-list">';
      for (var r = 0; r < inq.reasons.length; r++) {
        html += '<li>' + inq.reasons[r] + '</li>';
      }
      html += '</ul></div>';

      // Panel 2: Discovery Questions
      if (inq.questions.length > 0) {
        html += '<div class="expanded-panel">';
        html += '<h4 class="expanded-panel__title"><i data-lucide="help-circle" style="color:var(--color-info);"></i> 追问话术</h4>';
        html += '<ul class="question-list">';
        for (var q = 0; q < inq.questions.length; q++) {
          html += '<li class="question-item">';
          html += '<span class="question-num">' + (q+1) + '</span>';
          html += '<span style="flex:1;min-width:0;">' + inq.questions[q] + '</span>';
          html += '<span class="question-actions"><button class="btn btn--link" onclick="event.stopPropagation();" style="font-size:11px;">复制</button></span>';
          html += '</li>';
        }
        html += '</ul></div>';

        html += '<div class="expanded-panel" style="display:flex;align-items:center;justify-content:center;color:var(--color-muted-foreground);font-size:13px;">';

        html += '该询盘已完成，无需追问';
        html += '</div>';
      }

      // Panel 3: Language Bridge
      html += '<div class="expanded-panel">';
      html += '<h4 class="expanded-panel__title"><i data-lucide="languages" style="color:var(--color-info);"></i> 语言桥</h4>';
      html += '<button class="btn btn--default btn--sm" onclick="event.stopPropagation();" style="margin-bottom:8px;"><i data-lucide="file-text" style="width:12px;height:12px;"></i> 中文摘要</button>';
      html += '<div class="lang-summary">' + inq.message + '</div>';
      html += '<textarea class="lang-textarea" placeholder="输入中文回复内容..." onclick="event.stopPropagation();"></textarea>';
      html += '<button class="btn btn--primary btn--sm" onclick="event.stopPropagation();" style="margin-bottom:8px;"><i data-lucide="sparkles" style="width:12px;height:12px;"></i> 生成英文草稿</button>';
      html += '<div class="lang-draft" style="color:var(--color-muted-foreground);font-style:italic;">点击上方按钮生成 AI 英文回复草稿</div>';
      html += '</div>';

      // Panel 4: Full Message + Audit Trail
      html += '<div class="expanded-panel">';
      html += '<h4 class="expanded-panel__title"><i data-lucide="scroll-text" style="color:var(--color-primary);"></i> 完整留言</h4>';
      html += '<p class="full-msg">' + inq.fullMessage + '</p>';
      html += '<div style="margin-top:14px;border-top:1px solid rgba(255,255,255,0.06);padding-top:12px;">';
      html += '<h4 class="expanded-panel__title" style="margin-bottom:8px;"><i data-lucide="history" style="color:var(--color-warning);"></i> 变更记录</h4>';
      html += '<ul class="audit-list">';
      for (var a = 0; a < inq.audit.length; a++) {
        var au = inq.audit[a];
        html += '<li class="audit-item">';
        html += '<span class="audit-dot audit-dot--' + au.type + '"></span>';
        html += '<span class="audit-text"><strong>' + au.text + '</strong></span>';
        html += '<span class="audit-time">' + au.time + '</span>';
        html += '</li>';
      }
      html += '</ul></div></div>';

      html += '</div></td></tr>';
    }
  }
  tbody.innerHTML = html;
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function toggleRow(id) {
  expandedId = expandedId === id ? null : id;
  renderTable(inquiries);
}

function filterStatus(btn) {
  var tabs = btn.parentElement.querySelectorAll('.status-tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  btn.classList.add('active');
  var status = btn.getAttribute('data-status');
  if (status === 'all') {
    renderTable(inquiries);
  } else {
    var filtered = [];
    for (var i = 0; i < inquiries.length; i++) {
      if (inquiries[i].status === status) filtered.push(inquiries[i]);
    }
    renderTable(filtered);
  }
  expandedId = null;
}

function markProcessing(id) {
  for (var i = 0; i < inquiries.length; i++) {
    if (inquiries[i].id === id) {
      inquiries[i].status = 'quoted';
      inquiries[i].audit.push({type:'status', text:'状态变更为 处理中', time:'刚刚'});
      break;
    }
  }
  renderTable(inquiries);
}

function markComplete(id) {
  for (var i = 0; i < inquiries.length; i++) {
    if (inquiries[i].id === id) {
      inquiries[i].status = 'accepted';
      inquiries[i].audit.push({type:'complete', text:'标记完成', time:'刚刚'});
      break;
    }
  }
  renderTable(inquiries);
}

// ============================================================
// COUNT-UP
// ============================================================
function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
function animateCountUp(el, target, duration, useSeparator) {
  var start = performance.now();
  function tick(now) {
    var elapsed = now - start;
    var progress = Math.min(elapsed / duration, 1);
    var current = Math.round(easeOutExpo(progress) * target);
    el.textContent = useSeparator ? current.toLocaleString('en-US') : current;
    if (progress < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('load', function() {
  renderTable(inquiries);
  document.querySelectorAll('.count-up').forEach(function(el) {
    var target = parseInt(el.getAttribute('data-target'), 10);
    var duration = parseInt(el.getAttribute('data-duration') || '900', 10);
    animateCountUp(el, target, duration, false);
  });
});
</script>
<script>lucide.createIcons();</script>
</body>
