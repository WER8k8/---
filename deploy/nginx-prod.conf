# ============================================================
# 优丁建材 SaaS — 生产环境 Nginx 配置
# ============================================================
# 部署路径: 容器内 /etc/nginx/conf.d/default.conf
# 验证: nginx -t && nginx -s reload
# SSL 管理: certbot renew (Let's Encrypt 90天自动续期)
# ============================================================

# ----------------------------------------------------------
# 上游后端服务
# ----------------------------------------------------------
upstream backend_api {
    # Docker Compose 内网通信，服务名即 hostname
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ----------------------------------------------------------
# HTTP → HTTPS 重定向
# ----------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name youding.com www.youding.com youding-saas.com *.youding-saas.com;

    # Let's Encrypt ACME 域名验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其余所有请求强制跳转 HTTPS (301 永久重定向)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------
# HTTPS 主站
# ----------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name youding.com www.youding.com youding-saas.com *.youding-saas.com;

    # =======================================================
    # SSL 证书配置
    # =======================================================
    # 路径说明（容器内挂载点）:
    #   deploy/ssl/fullchain.pem → /etc/nginx/ssl/fullchain.pem
    #   deploy/ssl/privkey.pem   → /etc/nginx/ssl/privkey.pem
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL 协议与加密套件 (Mozilla Intermediate 推荐)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;  # 让客户端选择最优加密

    # SSL 会话缓存 (减少 TLS 握手开销)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (加速证书验证)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # =======================================================
    # 安全响应头
    # =======================================================

    # HSTS: 强制浏览器仅通过 HTTPS 访问 (max-age = 2年)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 防止点击劫持 (SAMEORIGIN 允许同源 iframe)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;

    # 启用浏览器 XSS 过滤器
    add_header X-XSS-Protection "1; mode=block" always;

    # 引荐策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 权限策略 (禁止不必要的浏览器功能)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), usb=(), magnetometer=(), gyroscope=(), speaker=(), vibrate=(), payment=()" always;

    # =======================================================
    # Content Security Policy (CSP)
    # =======================================================
    # 根据实际使用的第三方资源调整
    # script-src: 'unsafe-inline' 用于 Vue/Nuxt SPA
    # connect-src: 允许 API、飞书、AI 服务、Analytics
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com https://*.feishu.cn; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https: wss:; frame-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

    # =======================================================
    # 日志
    # =======================================================
    access_log /var/log/nginx/youding_access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/youding_error.log warn;

    # =======================================================
    # Gzip 压缩
    # =======================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/vnd.api+json
        application/manifest+json
        image/svg+xml
        font/woff2
        font/woff;

    # =======================================================
    # 根目录 — 前端静态资源
    # =======================================================
    root /usr/share/nginx/html;

    # -------------------------------------------------------
    # 静态资源缓存策略
    # -------------------------------------------------------

    # Nuxt 构建产物 — 文件名含 hash，永久缓存
    location /_nuxt/ {
        alias /usr/share/nginx/html/_nuxt/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # 图片资源 — 30天缓存
    location /images/ {
        alias /usr/share/nginx/html/images/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 字体文件 — 1年缓存
    location /fonts/ {
        alias /usr/share/nginx/html/fonts/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 允许跨域加载字体 (CORS)
        add_header Access-Control-Allow-Origin "*";
    }

    # Favicon — 7天
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Robots.txt — 1天
    location = /robots.txt {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # 站点地图 — 1小时
    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # LLMs.txt — GEO/AEO（租户独立域 $host 映射 public API）
    location = /llms.txt {
        proxy_pass http://backend_api/api/v1/public/tenants/$host/llms.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    location = /llms-full.txt {
        proxy_pass http://backend_api/api/v1/public/tenants/$host/llms-full.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # 租户上传资源（产品图等）
    location /uploads/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Service Worker / PWA manifest
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # -------------------------------------------------------
    # API 代理到 Python 后端
    # -------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # 超时配置 (AI 生成内容可能耗时较长)
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_connect_timeout 30s;

        # 缓冲配置
        proxy_buffering off;
        proxy_request_buffering off;

        # 大文件上传 (PDF, DWG 图纸等)
        client_max_body_size 100m;

        # 速率限制 (防止 API 滥用)
        limit_req zone=api_limit burst=50 nodelay;
    }

    # -------------------------------------------------------
    # WebSocket (飞书 Bot / Agent Hub / 实时通知)
    # -------------------------------------------------------
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # WebSocket 不限制 client body
        proxy_buffering off;
    }

    # -------------------------------------------------------
    # MinIO Console 代理 (管理端使用)
    # -------------------------------------------------------
    location /minio-console/ {
        proxy_pass http://minio:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MinIO Console 需要 WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 管理后台认证
        auth_basic "MinIO Console";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # -------------------------------------------------------
    # Grafana 代理
    # -------------------------------------------------------
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------
    # 前端 SPA 路由 (Vue Router / Nuxt)
    # -------------------------------------------------------
    location / {
        # 先尝试静态文件，再回退到 index.html (SPA 模式)
        try_files $uri $uri/ /index.html;

        # 安全策略: 禁止列出目录
        autoindex off;
    }

    # -------------------------------------------------------
    # 健康检查端点 (无日志，供负载均衡探测)
    # -------------------------------------------------------
    location /healthz {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # =======================================================
    # 安全限制
    # =======================================================

    # 禁止访问隐藏文件 (.env, .git, .htaccess 等)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 禁止直接访问备份文件和源码文件
    location ~* \.(bak|sql|tar|gz|zip|log|old|orig|save|swp|swo|~)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 仅允许标准 HTTP 方法
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # =======================================================
    # 请求限流区域定义
    # =======================================================
    # 在 http 块中定义:
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
}

# ----------------------------------------------------------
# 请求限流区域 (http 块，不可写在 server 块内)
# ----------------------------------------------------------
# 如果在主 nginx.conf 中未定义，可在 include 之前设置:
# http {
#     limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
#     ...
# }
