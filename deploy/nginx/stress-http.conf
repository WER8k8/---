server {
    listen 80;
    server_name youding.com localhost 127.0.0.1;
    client_max_body_size 100m;
    location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 300s; }
    location /health/ { proxy_pass http://backend:8000/health/; }
    location /uploads/ { proxy_pass http://backend:8000/uploads/; }
    location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
}
