# ============================================================
# Youding 生产部署配置
# ============================================================
# 用法:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ============================================================

version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------
  # 反向代理 / SSL 终止
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.26-alpine
    container_name: youding-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/uploads:/app/uploads:ro
    depends_on:
      - backend
    networks:
      - app-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ----------------------------------------------------------
  # 前端 (SSG 构建阶段, 产出静态文件供 nginx 使用)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: youding-frontend-builder
    volumes:
      - frontend_dist:/app/.output/public
    environment:
      - NUXT_PUBLIC_API_BASE=https://${DOMAIN:?err}/api/v1
      - NUXT_PUBLIC_SITE_URL=https://${DOMAIN:?err}
      - NUXT_PUBLIC_TENANT_ID=${NUXT_PUBLIC_TENANT_ID:-}
      - NUXT_PUBLIC_AGENT_NODE_ID=${NUXT_PUBLIC_AGENT_NODE_ID:-}
    networks:
      - app-network
    profiles:
      - build
    # 仅构建, 不常驻; 正常部署时预先构建好或用 CI 推送

  # ----------------------------------------------------------
  # 后端 API
  # ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: youding-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${DB_USER:?err}:${DB_PASSWORD:?err}@postgres:5432/${DB_NAME:?err}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?err}@redis:6379/0
      - REDIS_ENABLED=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?err}
      - SECRET_KEY=${SECRET_KEY:-${JWT_SECRET_KEY:?err}}
      - MVP_LAUNCH=${MVP_LAUNCH:-1}
      - PAYMENT_STRICT_VERIFY=${PAYMENT_STRICT_VERIFY:-1}
      - SSL_PROVIDER=${SSL_PROVIDER:-certbot}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
      - DEBUG=false
      - CORS_ORIGINS=["https://${DOMAIN:?err}"]
      - ALLOWED_HOSTS=["${DOMAIN:?err}"]
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
      - FRONTEND_URL=https://${DOMAIN:?err}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - AI_NVIDIA_API_KEY=${AI_NVIDIA_API_KEY:-}
      - AI_DEEPSEEK_API_KEY=${AI_DEEPSEEK_API_KEY:-}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?err}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?err}@redis:6379/1
      - DEERFLOW_TENANT_CELERY_ENABLED=true
      - HERMES_OPS_AUTOPILOT_ENABLED=${HERMES_OPS_AUTOPILOT_ENABLED:-true}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      # 生产 ENVIRONMENT=production 时自动开启英伟达模型探测（1:00/12:00/20:00 北京时间）
      - NVIDIA_CUSTOMER_PROBE_SLOTS=${NVIDIA_CUSTOMER_PROBE_SLOTS:-1:00,12:00,20:00}
      - NVIDIA_CUSTOMER_PROBE_TZ=${NVIDIA_CUSTOMER_PROBE_TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ----------------------------------------------------------
  # Celery Beat — SEO / GEO / DeerFlow 定时任务
  # ----------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: youding-celery-beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app:celery_app beat -l info
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${DB_USER:?err}:${DB_PASSWORD:?err}@postgres:5432/${DB_NAME:?err}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?err}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?err}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?err}@redis:6379/1
      - DEERFLOW_TENANT_CELERY_ENABLED=true
      - RANK_SCHEDULER_ENABLED=${RANK_SCHEDULER_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------
  # Celery Worker — deerflow + 默认队列
  # ----------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: youding-celery-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app:celery_app worker -Q celery,deerflow,cross_border -c 2 -l info
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${DB_USER:?err}:${DB_PASSWORD:?err}@postgres:5432/${DB_NAME:?err}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?err}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?err}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?err}@redis:6379/1
      - DEERFLOW_TENANT_CELERY_ENABLED=true
      - DEERFLOW_SCHEDULER_ENABLED=${DEERFLOW_SCHEDULER_ENABLED:-true}
      - HERMES_OPS_AUTOPILOT_ENABLED=${HERMES_OPS_AUTOPILOT_ENABLED:-true}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ----------------------------------------------------------
  # PostgreSQL
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: youding-postgres
    restart: unless-stopped
    # 仅容器网访问，不映射宿主机 5432（避免生产库暴露）
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${DB_NAME:?err}
      - POSTGRES_USER=${DB_USER:?err}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?err}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?err} -d ${DB_NAME:?err}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # ----------------------------------------------------------
  # Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: youding-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?err}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?err}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 256M

  # ----------------------------------------------------------
  # MinIO — 对象存储 (SEO 截图等)
  # ----------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: youding-minio
    restart: unless-stopped
    expose:
      - "9000"
      - "9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:?err}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?err}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ----------------------------------------------------------
  # 数据库定时备份
  # ----------------------------------------------------------
  db-backup:
    image: postgres:15-alpine
    container_name: youding-db-backup
    restart: unless-stopped
    environment:
      - PGHOST=postgres
      - PGDATABASE=${DB_NAME:?err}
      - PGUSER=${DB_USER:?err}
      - PGPASSWORD=${DB_PASSWORD:?err}
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=30
    volumes:
      - backup_data:/backups
    command: >
      sh -c "
        while true; do
          filename=\"backup_\$$(date +%Y%m%d_%H%M%S).sql.gz\";
          pg_dump -h postgres -U ${DB_USER:?err} ${DB_NAME:?err} | gzip > /backups/\"$$filename\";
          echo \"Backup created: $$filename\";
          find /backups -name 'backup_*.sql.gz' -type f -mtime +$${BACKUP_RETENTION_DAYS} -delete;
          sleep 86400;
        done
      "
    depends_on:
      - postgres
    networks:
      - app-network
    profiles:
      - backup
    logging: *default-logging

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  frontend_dist:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  backup_data:
    driver: local

networks:
  app-network:
    driver: bridge
