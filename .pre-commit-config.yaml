# FIX-7 + FIX-70: pre-commit hooks — 保障全栈代码质量
# 安装: pip install pre-commit && pre-commit install
# 手动运行: pre-commit run --all-files

repos:
  # ── 后端 Python ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # ── 前端 JS/TS/Vue ──
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.16.0
    hooks:
      - id: eslint
        files: ^(frontend)/.*\.(js|ts|vue|jsx|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@^9.16.0
          - "@vue/eslint-config-typescript"
          - eslint-plugin-vue
          - "@typescript-eslint/eslint-plugin"
          - "@typescript-eslint/parser"
          - eslint-plugin-import

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0
    hooks:
      - id: prettier
        files: ^(frontend)/.*\.(js|ts|vue|jsx|tsx|css|scss|json|md)$
        types_or: [javascript, typescript, vue, css, scss, json, markdown]

  # ── 通用 ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(backend|frontend)/
      - id: end-of-file-fixer
        files: ^(backend|frontend)/
      - id: check-yaml
        files: \.(yaml|yml)$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # ── 本地软门禁（提示但不阻断提交；硬门禁在 CI）──
  - repo: local
    hooks:
      - id: router-registration-drift
        name: Router Registration Drift (warn-only)
        description: 本地提交时提示后端路由注册漂移，不阻断提交；合入门禁在 CI router-drift 作业。
        entry: python backend/scripts/router_drift_precommit.py
        language: system
        pass_filenames: false
        files: ^backend/app/api/
      - id: db-model-drift
        name: ORM Model ↔ DB Drift (warn-only)
        description: 本地提交涉及 models/ 或 alembic 迁移时，提示 ORM 模型与物理库漂移；不阻断提交（需活 DB，无活 DB 时仅提示）。
        entry: python backend/scripts/db_model_drift_precommit.py
        language: system
        pass_filenames: false
        files: ^backend/(app/models/|alembic_migrations/versions/)
      - id: orchestration-selfcheck
        name: Orchestration Self-Check (warn-only)
        description: 本地提交涉及后端编排链路时，提示编排自检(19项)结果；不阻断提交（需活 PG/Celery/n8n，无活服务时仅提示）。
        entry: python backend/scripts/orchestration_selfcheck_precommit.py
        language: system
        pass_filenames: false
        files: ^backend/